<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Netpeak HB Manager — Onboarding</title><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17223b;background:#f4f7fb;font-size:14px}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:244px 1fr}.sidebar{background:#101a31;color:#f9fafb;padding:26px 18px}.brand{font-size:18px;font-weight:800;letter-spacing:-.5px;margin-bottom:5px}.brand span{color:#65a7ff}.hint{font-size:12px;color:#9cabca}.sidebar h5{margin:34px 8px 13px;color:#8595b8;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}.navbtn{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#bbc7dd;border-radius:9px;width:100%;padding:12px;cursor:pointer;text-align:left;font-size:13px}.navbtn.active{background:#233655;color:#fff;font-weight:700}.navbtn .n{display:grid;place-items:center;flex:0 0 25px;height:25px;border:1px solid #526481;border-radius:50%;font-size:11px}.navbtn.active .n{background:#3c83f6;border-color:#3c83f6}.main{padding:34px 4vw 80px;max-width:1300px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.eyebrow{color:#61728d;font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}.title{font-size:29px;font-weight:800;letter-spacing:-.9px;margin:6px 0 7px}.sub{color:#66758b;line-height:1.5}.status{padding:9px 13px;background:#e6edf8;border-radius:30px;color:#31547b;font-weight:700;font-size:12px}.sheet{background:white;border:1px solid #e2e8f1;border-radius:16px;box-shadow:0 5px 25px #162c5021;padding:25px;margin:18px 0}.sheet h2{margin:0 0 7px;font-size:18px}.sectionlead{color:#6f7e92;margin:0 0 22px;font-size:13px;line-height:1.55}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;color:#40526f;font-weight:700}input,select,textarea{font:inherit;width:100%;border:1px solid #ced8e5;border-radius:9px;padding:12px;color:#192943;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#4386eb;box-shadow:0 0 0 3px #4386eb1d}textarea{min-height:80px;resize:vertical}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}.btn{border:1px solid #d2dae7;background:#fff;color:#263958;padding:11px 15px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}.btn.primary{background:#2168d8;border-color:#2168d8;color:#fff}.btn.danger{color:#ab2842}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{border:2px solid #e0e8f2;border-radius:13px;padding:18px;cursor:pointer;display:flex;gap:12px}.option.chosen{border-color:#3d83ef;background:#f1f6ff}.option h3{font-size:15px;margin:0 0 8px}.option p{margin:0;color:#64748a;font-size:13px;line-height:1.5}.radioDot{width:18px;height:18px;border:2px solid #94a7be;border-radius:50%;flex-shrink:0;margin-top:2px}.chosen .radioDot{border:6px solid #297be9}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}th{text-align:left;font-size:11px;color:#65758a;letter-spacing:.3px;background:#f7f9fc;padding:12px;border-bottom:1px solid #e3e9f0}td{padding:12px;border-bottom:1px solid #ecf0f5;font-size:13px;vertical-align:middle}.smallnote{font-size:12px;color:#697991;margin-top:12px;line-height:1.5}.pill{border:1px solid #d8e6f7;color:#365a89;background:#edf5ff;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700;white-space:nowrap}.muted{color:#789}.empty{padding:28px;text-align:center;background:#fafbfd;border:1px dashed #cbd6e5;border-radius:10px;color:#61758d}.inline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.check{width:17px;height:17px;accent-color:#2168d8}.notice{padding:13px 15px;border:1px solid #cbdcf4;background:#f1f6fe;border-radius:10px;color:#355780;font-size:12px;line-height:1.6}.error{background:#fff0f2;color:#9e2441;border-color:#f3c6cf}.success{background:#eaf8f2;color:#146a4b;border-color:#bce5d5}.foot{border-top:1px solid #e7eaf0;padding-top:18px;margin-top:24px}.code{white-space:pre-wrap;word-break:break-word;background:#121d30;color:#d0e7ff;border-radius:11px;padding:18px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.65;max-height:360px;overflow:auto}.rowhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.progress{height:7px;background:#e4eaf3;border-radius:10px;overflow:hidden;margin-top:15px}.progress>div{height:100%;background:#3d83ef;transition:width .2s}.toast{position:fixed;bottom:25px;right:25px;background:#152745;color:white;border-radius:10px;padding:13px 19px;box-shadow:0 12px 24px #0003;z-index:3}.mini{font-size:11px;color:#8795a9}.sidebarbottom{margin-top:30px;padding:14px;background:#1c2a45;border-radius:10px}.narrow{max-width:920px}.badge{display:inline-block;color:#58719a;font-size:11px;border-radius:15px;background:#edf3fa;padding:5px 9px}@media(max-width:850px){.app{display:block}.sidebar{padding:15px}.sidebar h5,.sidebarbottom{display:none}.brand{margin-bottom:10px}.nav{display:flex;overflow:auto;gap:6px}.navbtn{width:auto;white-space:nowrap}.navbtn .n{display:none}.main{padding:20px 14px 60px}.fields,.grid2{grid-template-columns:1fr}.top{align-items:start}.title{font-size:24px}.sheet{padding:17px}.status{white-space:nowrap}} </style></head>
<body><div id="app"></div><script>
(()=>{'use strict';
const KEY='netpeak_hbm_ui_v1';const steps=['Видавець','Вебсайти','Режим GPT','Рекламні блоки','Каталог SSP','Призначення bidder-ів','Налаштування аукціону','Перевірка та експорт'];
const catalog={openweb:{name:'OpenWeb',params:[{key:'org',required:true},{key:'placementId',required:true}]},adyoulike:{name:'AdYouLike',params:[{key:'placement',required:true}]},appnexus:{name:'AppNexus / Xandr',params:[{key:'placementId',required:false},{key:'member',required:false},{key:'invCode',required:false}]},rubicon:{name:'Magnite / Rubicon',params:[{key:'accountId',required:true},{key:'siteId',required:true},{key:'zoneId',required:true}]}};
const fresh=()=>({publisher:{name:'',id:'',contact:''},sites:[],siteId:'',step:0});let state=load();let editUnit=null;let toastTimer;let customSsp={};
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.publisher&&Array.isArray(o.sites))return o;}catch{}return fresh()}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function current(){return state.sites.find(s=>s.id===state.siteId)||state.sites[0]||null}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(prefix){return prefix+'_'+Math.random().toString(36).slice(2,9)}
function notify(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2600)}
function siteDefaults(domain){return {id:uid('site'),domain,network:'',mode:'own',units:[],ssps:[],assignments:{},auction:{timeout:2500,granularity:'custom',maxCpm:20,currency:'USD',debug:false,sendAll:false,tids:true},published:false}}
function btn(label,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`}
function field(label,name,value='',opts={}){return `<div class="field ${opts.full?'full':''}"><label for="${name}">${esc(label)}</label><input id="${name}" data-field="${name}" value="${esc(value)}" placeholder="${esc(opts.placeholder||'')}" ${opts.type?'type="'+opts.type+'"':''}></div>`}
function header(){const s=current();return `<div class="top"><div><div class="eyebrow">Netpeak / Header Bidding</div><div class="title">${esc(steps[state.step])}</div><div class="sub">${s?'Видавець: '+esc(state.publisher.name||'Без назви')+' · '+esc(s.domain):'Створіть і налаштуйте першого видавця'}</div></div><div class="status">${s&&s.published?'Опублікована версія':'Чернетка · локально'}</div></div><div class="progress"><div style="width:${(state.step+1)/steps.length*100}%"></div></div>`}
function publisher(){return `<div class="sheet narrow"><h2>Профіль видавця</h2><p class="sectionlead">Картка клієнта. Дані автоматично зберігаються в браузері після зміни полів.</p><div class="fields">${field('Назва видавця *','publisher.name',state.publisher.name,{placeholder:'Наприклад, Oink Media'})}${field('Внутрішній ID видавця','publisher.id',state.publisher.id,{placeholder:'oink-media'})}${field('Контакт / Примітки','publisher.contact',state.publisher.contact,{full:true,placeholder:'Контакт, коментар'})}</div><div class="notice" style="margin-top:20px">Перший прототип підтримує одну картку видавця в цьому браузері та кілька сайтів у ній. Підтримку багатьох видавців додамо на наступному етапі.</div></div>`}
function websites(){return `<div class="sheet narrow"><div class="rowhead"><div><h2>Вебсайти</h2><div class="sub">Один видавець може мати кілька сайтів.</div></div>${btn('+ Додати сайт','add-site','primary')}</div>${state.sites.length?`<div class="tablewrap"><table><thead><tr><th>Домен</th><th>GAM Network ID</th><th>Рекламні блоки</th><th>Дії</th></tr></thead><tbody>${state.sites.map(s=>`<tr><td><b>${esc(s.domain)}</b> ${s.id===state.siteId?'<span class="pill">Вибрано</span>':''}</td><td>${esc(s.network||'—')}</td><td>${s.units.length}</td><td>${btn('Вибрати','select-site:'+s.id,'small')} ${btn('Видалити','remove-site:'+s.id,'small danger')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Сайтів поки немає. Натисніть «Додати сайт».</div>'}${current()?`<div class="foot"><h2>Вибраний сайт</h2><div class="fields">${field('Домен *','site.domain',current().domain)}${field('GAM Network ID','site.network',current().network,{placeholder:'23114056084'})}</div></div>`:''}</div>`}
function mode(){const s=current();return `<div class="sheet narrow"><h2>Режим інтеграції GPT</h2><p class="sectionlead">Режим вибирається окремо для кожного сайту, а не для видавця.</p><div class="grid2"><div class="option ${s.mode==='own'?'chosen':''}" data-action="mode:own"><div class="radioDot"></div><div><h3>Publisher Own GPT</h3><p>Наявні GPT-слоти. Wrapper запускає HB лише для попередньо налаштованих і знайдених рекламних блоків; момент запиту має бути узгоджений із GPT.</p></div></div><div class="option ${s.mode==='managed'?'chosen':''}" data-action="mode:managed"><div class="radioDot"></div><div><h3>Managed GPT — All-in-One</h3><p>Wrapper визначає слоти та керує GPT-запитами. Вбудоване керування життєвим циклом GAM і готові теги розміщення.</p></div></div></div><div class="notice" style="margin-top:20px">${s.mode==='own'?'Сканер буде необов’язковим. Основний сценарій — заздалегідь вручну додати рекламні блоки.':'У робочій версії додамо налаштування контейнерів і розміщення тегів.'}</div></div>`}
function units(){const s=current();return `<div class="sheet"><div class="rowhead"><div><h2>Інвентар рекламних блоків</h2><div class="sub">Додайте всі слоти, які мають брати участь у HB.</div></div>${btn('+ Додати блок','add-unit','primary')}</div>${s.units.length?`<div class="tablewrap"><table><thead><tr><th>Назва</th><th>Шлях GAM</th><th>Div ID</th><th>Розміри</th><th>Дії</th></tr></thead><tbody>${s.units.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.path)}</td><td>${esc(u.div)}</td><td>${esc(u.sizes)}</td><td>${btn('Редагувати','edit-unit:'+u.id,'small')} ${btn('Видалити','remove-unit:'+u.id,'small danger')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Рекламних блоків поки немає. Додайте перший GPT-слот.</div>'}<p class="smallnote">Розміри вказуються через кому, наприклад: 300x250, 300x600. Сканер, імпорт CSV та GAM API будуть окремими опціями.</p></div>${editUnit!==null?unitForm(editUnit):''}`}
function unitForm(u){return `<div class="sheet narrow"><h2>${u.id?'Редагувати':'New'} Ad Unit</h2><div class="fields">${field('Назва *','unit.name',u.name,{placeholder:'desktop-blog-right1'})}${field('Шлях рекламного блоку GAM *','unit.path',u.path,{placeholder:'/23114056084/np_oink/desktop-blog-right1'})}${field('GPT Div ID *','unit.div',u.div,{placeholder:'div-gpt-ad-...'})}${field('Розміри *','unit.sizes',u.sizes,{placeholder:'300x250, 300x600'})}<div class="field"><label>Тип медіа</label><select data-field="unit.media">${['banner','video','native'].map(t=>`<option value="${t}" ${u.media===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="actions">${btn('Скасувати','cancel-unit')}${btn('Зберегти блок','save-unit','primary')}</div></div>`}
function ssps(){const s=current();return `<div class="sheet narrow"><h2>Каталог адаптерів Prebid</h2><p class="sectionlead">Виберіть SSP для сайту. Це демонстраційний каталог; адаптери та обов’язкові поля згодом синхронізуватимуться з підтримуваною версією Prebid.</p><div class="field" style="max-width:390px"><label>Фільтр адаптерів</label><input id="ssp-filter" placeholder="Пошук bidder-а..." autocomplete="off"></div><div id="ssp-list">${Object.entries(catalog).map(([key,b])=>`<div class="option" style="margin-top:10px;cursor:default"><input class="check" type="checkbox" data-ssp="${key}" ${s.ssps.includes(key)?'checked':''}><div><h3>${esc(b.name)} <span class="mini">${key}</span></h3><p>${b.params.map(x=>x.key+(x.required?' *':'')).join(', ')}</p></div></div>`).join('')}</div><p class="smallnote">* — обов’язковий параметр у демонстраційній схемі. У робочій системі буде імпорт каталогу та власні адаптери.</p></div>`}
function map(){const s=current();const connected=s.ssps;return `<div class="sheet"><h2>Призначення bidder-ів</h2><p class="sectionlead">Параметри вводяться для кожної пари рекламний блок × SSP. Зміни зберігаються під час введення.</p>${!s.units.length||!connected.length?'<div class="empty">Спочатку додайте принаймні один рекламний блок і виберіть SSP.</div>':s.units.map(u=>`<div class="sheet" style="box-shadow:none;margin:14px 0"><div class="rowhead"><div><b>${esc(u.name)}</b><div class="mini">${esc(u.sizes)}</div></div><span class="pill">Ad Unit</span></div>${connected.map(code=>{const reg=catalog[code]||{name:code,params:[]};const a=s.assignments[u.id]?.[code]||{enabled:true,params:{}};return `<div style="border-top:1px solid #e8edf5;padding:15px 0"><div class="inline"><label style="font-size:14px"><input class="check" type="checkbox" data-map-enabled="${esc(u.id)}|${esc(code)}" ${a.enabled?'checked':''}> ${esc(reg.name)} <span class="mini">${esc(code)}</span></label></div><div class="fields" style="margin-top:12px">${reg.params.map(p=>field(p.key+(p.required?' *':''),`param|${u.id}|${code}|${p.key}`,a.params?.[p.key]||'')).join('')}<div class="field full"><label>Додаткові параметри (JSON-об’єкт)</label><textarea data-custom="${esc(u.id)}|${esc(code)}" placeholder='{"customField":"value"}'>${esc(a.custom||'')}</textarea></div></div></div>`}).join('')}</div>`).join('')}</div>`}
function auction(){const s=current(),a=s.auction;return `<div class="sheet narrow"><h2>Типові налаштування аукціону</h2><p class="sectionlead">Типові значення вже встановлені. Їх можна змінити окремо для кожного сайту.</p><div class="fields"><div class="field"><label>Тайм-аут bidder-ів (мс)</label><input type="number" min="500" max="10000" data-auction="timeout" value="${a.timeout}"></div><div class="field"><label>Цінова гранулярність</label><select data-auction="granularity">${['custom','low','medium','high','dense','auto'].map(v=>`<option ${a.granularity===v?'selected':''} value="${v}">${v==='custom'?'Власна (крок $0.05) — запропоновано':v}</option>`).join('')}</select></div><div class="field"><label>Максимальна ціна для власних діапазонів ($)</label><input type="number" min="1" max="100" step="1" data-auction="maxCpm" value="${a.maxCpm}"></div><div class="field"><label>Валюта</label><select data-auction="currency"><option value="USD" ${a.currency==='USD'?'selected':''}>USD</option><option value="EUR" ${a.currency==='EUR'?'selected':''}>EUR</option></select></div></div><div class="foot"><h2>Додаткові налаштування</h2>${[['debug','Журнал налагодження'],['sendAll','Передавати таргетинг усіх ставок'],['tids','Увімкнути Transaction IDs (з урахуванням налаштувань приватності)']].map(([k,title])=>`<div style="padding:9px 0"><label><input type="checkbox" class="check" data-auction="${k}" ${a[k]?'checked':''}> ${title}</label></div>`).join('')}</div>${btn('Відновити типові налаштування Netpeak','restore-auction','small')}</div>`}
function buildConfig(s){const adUnits=s.units.map(u=>({code:u.div,mediaTypes:{[u.media||'banner']:u.media==='banner'?{sizes:parseSizes(u.sizes)}:{}},bids:s.ssps.filter(code=>(s.assignments[u.id]?.[code]?.enabled??true)).map(code=>{let m=s.assignments[u.id]?.[code]||{};let params={...(m.params||{})};try{Object.assign(params,JSON.parse(m.custom||'{}'))}catch{}return {bidder:code,params}})}));return {siteId:s.id,domain:s.domain,gamNetworkId:s.network,integrationMode:s.mode,auction:s.auction,adUnits,slotMapping:s.units.map(u=>({adUnitCode:u.div,gamPath:u.path,divId:u.div}))}}
function parseSizes(raw){return String(raw||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>x.split(/[x×]/i).map(Number)).filter(x=>x.length===2&&x.every(n=>Number.isInteger(n)&&n>0))}
function validate(s){const errors=[],warnings=[];if(!state.publisher.name.trim())errors.push('Не вказано назву видавця');if(!s.domain.trim())errors.push('Не вказано домен сайту');if(!/^\d+$/.test(s.network))warnings.push('Не налаштовано GAM Network ID');if(!s.units.length)errors.push('Не додано рекламних блоків');if(!s.ssps.length)errors.push('Не вибрано SSP');const ids=new Set();for(const u of s.units){if(!u.name||!u.path||!u.div)errors.push(`Не заповнено поля рекламного блоку ${u.name||u.id}`);if(ids.has(u.div))errors.push(`Повторюється Div ID ${u.div}`);ids.add(u.div);if(!parseSizes(u.sizes).length&&u.media==='banner')errors.push(`Некоректні розміри банера для ${u.name}`);for(const code of s.ssps){const a=s.assignments[u.id]?.[code]||{};if(a.enabled===false)continue;for(const p of catalog[code]?.params||[]){if(p.required&&!a.params?.[p.key]?.trim())errors.push(`${u.name}: ${code}.${p.key} — обов’язкове поле`)}if(a.custom){try{if(typeof JSON.parse(a.custom)!=='object')throw Error('not an object')}catch{errors.push(`${u.name}: некоректний JSON додаткових параметрів для ${code}`)}}}}warnings.push('Цей прототип не перевіряє автоматично синхронізацію GPT-запитів і сумісність із line items у GAM');return {errors,warnings}}
function review(){const s=current(),v=validate(s),config=buildConfig(s);return `<div class="sheet"><h2>Перевірка та експорт</h2><p class="sectionlead">Перевіряємо структуру перед майбутньою публікацією. Поки що лише створюємо JSON-конфігурацію, не завантажуючи її на сайт.</p><div class="grid2"><div class="notice">Видавець: <b>${esc(state.publisher.name||'—')}</b><br>Сайт: <b>${esc(s.domain)}</b><br>Режим: <b>${s.mode==='own'?'Publisher Own GPT':'Managed GPT'}</b></div><div class="notice">Рекламні блоки: <b>${s.units.length}</b><br>SSP: <b>${s.ssps.length}</b><br>Тайм-аут аукціону: <b>${s.auction.timeout} ms</b></div></div><h2 style="margin:22px 0 12px">Перевірка</h2>${v.errors.length?`<div class="notice error"><b>${v.errors.length} помилок, які треба виправити</b><ul>${v.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:'<div class="notice success">Базову перевірку конфігурації пройдено. Це не підтверджує роботу інтеграції HB/GAM.</div>'}<div class="notice" style="margin-top:12px"><b>Перевірки інтеграції ще не виконані</b><ul>${v.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div><div class="rowhead" style="margin-top:22px"><h2>Попередній перегляд згенерованої конфігурації</h2><div class="inline">${btn('Завантажити JSON','export-site','small primary')} ${btn('Експортувати всю робочу область','export-full','small')}</div></div><pre class="code">${esc(JSON.stringify(config,null,2))}</pre><p class="smallnote">Це ще не робочий Wrapper. Інтерфейс не надсилає запитів до GAM або SSP. Реальна публікація, збирання адаптерів і координація GPT — наступні етапи.</p></div>`}
function render(){const s=current();const blocked=state.step>=2&&!s;document.querySelector('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">Netpeak <span>HB</span></div><div class="hint">Менеджер · прототип інтерфейсу v0.1 UA</div><h5>Майстер підключення</h5><div class="nav">${steps.map((v,i)=>`<button class="navbtn ${i===state.step?'active':''}" data-action="step:${i}"><span class="n">${i+1}</span>${v}</button>`).join('')}</div><div class="sidebarbottom"><div class="mini">ЗБЕРІГАННЯ</div><div style="margin-top:6px;font-size:12px;line-height:1.5">Лише в цьому браузері. Без сервера та синхронізації з GitHub.</div></div></aside><main class="main">${header()}${blocked?'<div class="sheet empty">Спочатку додайте сайт, щоб продовжити підключення.</div>':[publisher,websites,mode,units,ssps,map,auction,review][state.step]()}<div class="actions"><div>${btn('← Назад','prev','')}</div><div class="inline">${btn('Зберегти локально','save','')}${btn(state.step===7?'До видавця':'Продовжити →','next','primary')}</div></div></main></div>`;}
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function handleAction(raw){const [action,arg]=raw.split(':');let s=current();switch(action){case 'step':state.step=+arg;editUnit=null;break;case 'next':state.step=state.step===7?0:state.step+1;editUnit=null;break;case 'prev':state.step=Math.max(0,state.step-1);editUnit=null;break;case 'save':persist();notify('Збережено в цьому браузері');return;case 'add-site':{const d=prompt('Домен сайту (наприклад, oink.bg)');if(!d)return;const domain=d.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'').toLowerCase();if(!domain)return;if(state.sites.some(s=>s.domain===domain)){alert('Такий сайт уже існує');return}const n=siteDefaults(domain);state.sites.push(n);state.siteId=n.id;break}case 'select-site':state.siteId=arg;break;case 'remove-site':if(!confirm('Видалити сайт та всі його налаштування?'))return;state.sites=state.sites.filter(x=>x.id!==arg);state.siteId=state.sites[0]?.id||'';break;case 'mode':s.mode=arg;break;case 'add-unit':editUnit={id:'',name:'',path:'',div:'',sizes:'300x250',media:'banner'};break;case 'edit-unit':editUnit={...s.units.find(u=>u.id===arg)};break;case 'cancel-unit':editUnit=null;break;case 'save-unit':{const u=editUnit;if(!u.name.trim()||!u.path.trim()||!u.div.trim()||!u.sizes.trim()){alert('Заповніть назву, шлях GAM, div ID і розміри');return}if(s.units.some(x=>x.div===u.div&&x.id!==u.id)){alert('Div ID має бути унікальним');return}if(!u.id)u.id=uid('unit');const i=s.units.findIndex(x=>x.id===u.id);i<0?s.units.push(u):s.units.splice(i,1,u);editUnit=null;break}case 'remove-unit':if(!confirm('Видалити цей рекламний блок?'))return;s.units=s.units.filter(x=>x.id!==arg);delete s.assignments[arg];break;case 'restore-auction':s.auction=siteDefaults('').auction;break;case 'export-site':download((s.domain||'site')+'-hb-config.json',buildConfig(s));notify('JSON експортовано');return;case 'export-full':download('netpeak-hb-workspace.json',state);notify('Робочу область експортовано');return;}persist();render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){handleAction(el.dataset.action)}});
document.addEventListener('input',e=>{const el=e.target;const name=el.dataset.field;if(name && !name.startsWith('param|')){const val=el.value;if(name.startsWith('publisher.'))state.publisher[name.slice(10)]=val;else if(name.startsWith('site.'))current()[name.slice(5)]=val;else if(name.startsWith('unit.')&&editUnit)editUnit[name.slice(5)]=val;persist();return}if(el.dataset.auction){current().auction[el.dataset.auction]=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;persist();return}if(el.dataset.mapEnabled){const [u,c]=el.dataset.mapEnabled.split('|');const a=current().assignments; a[u]??={};a[u][c]??={enabled:true,params:{}};a[u][c].enabled=el.checked;persist();return}if(el.dataset.field?.startsWith('param|'))return;if(el.dataset.custom){const [u,c]=el.dataset.custom.split('|');const a=current().assignments; a[u]??={};a[u][c]??={enabled:true,params:{}};a[u][c].custom=el.value;persist();return}if(el.dataset.ssp){const list=current().ssps;current().ssps=el.checked?[...new Set([...list,el.dataset.ssp])]:list.filter(x=>x!==el.dataset.ssp);persist();return}if(el.id==='ssp-filter'){const term=el.value.toLowerCase();document.querySelectorAll('#ssp-list .option').forEach(row=>row.style.display=row.textContent.toLowerCase().includes(term)?'':'none');return}});
document.addEventListener('input',e=>{const name=e.target.dataset.field;if(name?.startsWith('param|')){const [,u,c,p]=name.split('|');const a=current().assignments;a[u]??={};a[u][c]??={enabled:true,params:{}};a[u][c].params[p]=e.target.value;persist()}});
document.addEventListener('change',e=>{if(e.target.matches('select[data-field], select[data-auction]')){e.target.dispatchEvent(new Event('input',{bubbles:true}))}});
render();
})();</script></body></html>
